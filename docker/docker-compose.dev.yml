# Local dev stack. The database is Neon (same instance the app uses) — there is
# no local Postgres service and no auto-migration step here: DATABASE_URL comes
# from the environment, and schema changes are applied deliberately, never as a
# side effect of starting the stack.
services:
  gateway:
    build:
      context: ..
      dockerfile: apps/gateway/Dockerfile
    ports:
      - "8285:8285"
    environment:
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required (Neon connection string)}
      GATEWAY_PORT: "8285"
      GATEWAY_BASE_URL: http://localhost:8285
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GOOGLE_GWS_CLIENT_ID: ${GOOGLE_GWS_CLIENT_ID:-}
      GOOGLE_GWS_CLIENT_SECRET: ${GOOGLE_GWS_CLIENT_SECRET:-}
      ATLASSIAN_CLIENT_ID: ${ATLASSIAN_CLIENT_ID:-}
      ATLASSIAN_CLIENT_SECRET: ${ATLASSIAN_CLIENT_SECRET:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      NODE_ENV: development
    networks:
      - dtrmcp

networks:
  dtrmcp:
    name: datatorag-mcp-network
    driver: bridge
