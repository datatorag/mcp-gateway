# The gateway in production. One file, two ways to start it:
#
#   Pipeline path   scripts/host-deploy.sh, from a copy of this file that a
#                   person installed on the host. It sets GATEWAY_IMAGE to a
#                   registry reference by digest and starts with --no-build
#                   and --pull never, so the `build` block is not used and its
#                   context does not need to exist there.
#   Scripted path   scripts/deploy-gateway.sh, from a checkout, with --build.
#                   GATEWAY_IMAGE is not set, so the image built is named
#                   docker-gateway, the name it has always had.
#
# Both use the compose project `docker`, so the container, the plugin volume
# and the network are the same whichever path started the gateway last.
#
# A value added to `environment` here reaches production only when the copy on
# the host is replaced. The deploy workflow compares that copy's checksum with
# this file on main and stops a deploy when they differ.
services:
  gateway:
    image: ${GATEWAY_IMAGE:-docker-gateway}
    build:
      context: ..
      dockerfile: apps/gateway/Dockerfile
      args:
        GATEWAY_SHA: ${GATEWAY_SHA:-}
        NEXT_PUBLIC_POSTHOG_KEY: ${NEXT_PUBLIC_POSTHOG_KEY:-}
        NEXT_PUBLIC_GOOGLE_ADS_CONVERSION_LABEL: ${NEXT_PUBLIC_GOOGLE_ADS_CONVERSION_LABEL:-}
        NEXT_PUBLIC_GOOGLE_ADS_SIGNUP_CONVERSION_LABEL: ${NEXT_PUBLIC_GOOGLE_ADS_SIGNUP_CONVERSION_LABEL:-}
    ports:
      - "80:80"
    environment:
      DATABASE_URL: ${DATABASE_URL}
      GATEWAY_PORT: "80"
      TEST_RUNNER_ENVIRONMENT: "prod"
      TEST_RUNNER_FIXTURES: ${TEST_RUNNER_FIXTURES:-}
      GATEWAY_BASE_URL: ${GATEWAY_BASE_URL:-http://localhost}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GOOGLE_GWS_CLIENT_ID: ${GOOGLE_GWS_CLIENT_ID:-}
      GOOGLE_GWS_CLIENT_SECRET: ${GOOGLE_GWS_CLIENT_SECRET:-}
      ATLASSIAN_CLIENT_ID: ${ATLASSIAN_CLIENT_ID:-}
      ATLASSIAN_CLIENT_SECRET: ${ATLASSIAN_CLIENT_SECRET:-}
      POSTHOG_API_KEY: ${POSTHOG_API_KEY:-}
      NEXT_PUBLIC_POSTHOG_KEY: ${NEXT_PUBLIC_POSTHOG_KEY:-}
      SLACK_BOT_TOKEN: ${SLACK_BOT_TOKEN:-}
      SLACK_CHANNEL_LEADS: ${SLACK_CHANNEL_LEADS:-}
      SLACK_CHANNEL_DIGEST: ${SLACK_CHANNEL_DIGEST:-}
      SLACK_CHANNEL_ALERTS: ${SLACK_CHANNEL_ALERTS:-}
      POSTHOG_PERSONAL_API_KEY: ${POSTHOG_PERSONAL_API_KEY:-}
      POSTHOG_PROJECT_ID: ${POSTHOG_PROJECT_ID:-}
      INTERNAL_EXCLUDE_EMAILS: ${INTERNAL_EXCLUDE_EMAILS:-}
      INTERNAL_EXCLUDE_IDS: ${INTERNAL_EXCLUDE_IDS:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      PLAYGROUND_MODEL: ${PLAYGROUND_MODEL:-claude-sonnet-5-5}
      PLAYGROUND_MESSAGE_CAP: ${PLAYGROUND_MESSAGE_CAP:-20}
      SLACK_CHANNEL_FEEDBACK: ${SLACK_CHANNEL_FEEDBACK:-}
      BREVO_API_KEY: ${BREVO_API_KEY:-}
      # Billing (Stage 1). All four must be present for checkout + webhooks;
      # the webhook route deliberately 503s without its secret rather than
      # accepting unverifiable events, so a gap here is loud at the route.
      STRIPE_API_KEY: ${STRIPE_API_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      STRIPE_PRO_MONTHLY_PRICE_ID: ${STRIPE_PRO_MONTHLY_PRICE_ID:-}
      STRIPE_PRO_YEARLY_PRICE_ID: ${STRIPE_PRO_YEARLY_PRICE_ID:-}
      # SCRUM-231: the campaign's promotion code id, applied at checkout.
      STRIPE_PROMOTION_CODE_ID: ${STRIPE_PROMOTION_CODE_ID:-}
      # This service enumerates the container's environment explicitly, so a
      # var present in .env but missing HERE never reaches the process. That is
      # how the agent default-view flag came to be unflippable in production:
      # it was set in SSM, rendered into .env, and silently ignored, while the
      # deploy reported success and the health check stayed green.
      #
      # The `:-off` default is load-bearing, not decoration. The env schema is
      # an enum of exactly "on" or "off", so an UNSET var falls back to the
      # schema default and is fine, but an EMPTY one fails validation and exits
      # the gateway at boot. Bare ${AGENT_DEFAULT_VIEW} would interpolate to
      # empty whenever the parameter is absent and take production down.
      AGENT_DEFAULT_VIEW: ${AGENT_DEFAULT_VIEW:-off}
      NODE_ENV: production
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost/health').then(r=>{if(!r.ok)throw r.status;process.exit(0)}).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    volumes:
      - plugins-data:/root/.datatorag/plugins
    # Equal to the memory limit below, so the container gets no swap at all.
    # Left unset, Docker allows swap equal to the memory limit again. The host
    # has no swap today; this keeps content held in memory off the disk even
    # if someone enables swap later.
    memswap_limit: 3072M
    deploy:
      resources:
        limits:
          memory: 3072M
    networks:
      - dtrmcp
    restart: unless-stopped

networks:
  dtrmcp:
    name: datatorag-mcp-network
    driver: bridge

volumes:
  plugins-data:
