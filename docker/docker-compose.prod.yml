services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: datatoragmcp
      POSTGRES_USER: datatoragmcp
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U datatoragmcp"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - dtrmcp
    restart: unless-stopped

  db-init:
    build:
      context: ..
      dockerfile: packages/db/Dockerfile
    environment:
      DATABASE_URL: postgresql://datatoragmcp:${POSTGRES_PASSWORD}@postgres:5432/datatoragmcp
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - dtrmcp
    restart: "no"

  gateway:
    build:
      context: ..
      dockerfile: apps/gateway/Dockerfile
      args:
        NEXT_PUBLIC_POSTHOG_KEY: ${NEXT_PUBLIC_POSTHOG_KEY:-}
        NEXT_PUBLIC_GOOGLE_ADS_CONVERSION_LABEL: ${NEXT_PUBLIC_GOOGLE_ADS_CONVERSION_LABEL:-}
        NEXT_PUBLIC_GOOGLE_ADS_SIGNUP_CONVERSION_LABEL: ${NEXT_PUBLIC_GOOGLE_ADS_SIGNUP_CONVERSION_LABEL:-}
    ports:
      - "80:80"
    environment:
      DATABASE_URL: ${DATABASE_URL}
      GATEWAY_PORT: "80"
      GATEWAY_BASE_URL: ${GATEWAY_BASE_URL:-http://localhost}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GOOGLE_GWS_CLIENT_ID: ${GOOGLE_GWS_CLIENT_ID:-}
      GOOGLE_GWS_CLIENT_SECRET: ${GOOGLE_GWS_CLIENT_SECRET:-}
      ATLASSIAN_CLIENT_ID: ${ATLASSIAN_CLIENT_ID:-}
      ATLASSIAN_CLIENT_SECRET: ${ATLASSIAN_CLIENT_SECRET:-}
      POSTHOG_API_KEY: ${POSTHOG_API_KEY:-}
      NEXT_PUBLIC_POSTHOG_KEY: ${NEXT_PUBLIC_POSTHOG_KEY:-}
      SLACK_BOT_TOKEN: ${SLACK_BOT_TOKEN:-}
      SLACK_CHANNEL_LEADS: ${SLACK_CHANNEL_LEADS:-}
      SLACK_CHANNEL_DIGEST: ${SLACK_CHANNEL_DIGEST:-}
      SLACK_CHANNEL_ALERTS: ${SLACK_CHANNEL_ALERTS:-}
      POSTHOG_PERSONAL_API_KEY: ${POSTHOG_PERSONAL_API_KEY:-}
      POSTHOG_PROJECT_ID: ${POSTHOG_PROJECT_ID:-}
      INTERNAL_EXCLUDE_EMAILS: ${INTERNAL_EXCLUDE_EMAILS:-}
      INTERNAL_EXCLUDE_IDS: ${INTERNAL_EXCLUDE_IDS:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      PLAYGROUND_PROVIDER: ${PLAYGROUND_PROVIDER:-anthropic}
      PLAYGROUND_MODEL: ${PLAYGROUND_MODEL:-claude-sonnet-5}
      PLAYGROUND_MESSAGE_CAP: ${PLAYGROUND_MESSAGE_CAP:-20}
      SLACK_CHANNEL_FEEDBACK: ${SLACK_CHANNEL_FEEDBACK:-}
      BREVO_API_KEY: ${BREVO_API_KEY:-}
      NODE_ENV: production
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost/health').then(r=>{if(!r.ok)throw r.status;process.exit(0)}).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    volumes:
      - plugins-data:/root/.datatorag/plugins
    deploy:
      resources:
        limits:
          memory: 1024M
    networks:
      - dtrmcp
    restart: unless-stopped

networks:
  dtrmcp:
    name: datatorag-mcp-network
    driver: bridge

volumes:
  postgres-data:
  plugins-data:
